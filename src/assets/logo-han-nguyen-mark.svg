<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 480" width="540" height="480" role="img" aria-label="Kế Toán Hân Nguyễn logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Kế Toán Hân Nguyễn</title>
  <defs>
    <!-- brushed-brass gradient shared by the whole monogram -->
    <linearGradient id="brass" gradientUnits="userSpaceOnUse" x1="88" y1="118" x2="513" y2="386">
      <stop offset="0"    stop-color="#F3E2A0"/>
      <stop offset="0.22" stop-color="#D8B24A"/>
      <stop offset="0.48" stop-color="#B58A1C"/>
      <stop offset="0.68" stop-color="#E6CB74"/>
      <stop offset="1"    stop-color="#9A771B"/>
    </linearGradient>
    <linearGradient id="brassTextUnused" gradientUnits="userSpaceOnUse" x1="590" y1="140" x2="1335" y2="340">
      <stop offset="0"   stop-color="#C79C2C"/>
      <stop offset="0.5" stop-color="#E2C266"/>
      <stop offset="1"   stop-color="#B08417"/>
    </linearGradient>
  </defs>

  <!-- corner frame -->
  <path d="M24 44H364V56H37V446H24Z" fill="url(#brass)"/>

  <!-- H : left stem + crossbar -->
  <rect x="88"  y="118" width="70" height="267" fill="url(#brass)"/>
  <rect x="156" y="224" width="88" height="48"  fill="url(#brass)"/>

  <!-- shared stem + N diagonal + check-mark swoosh -->
  <path d="M240 122H330L412 268L513 224L412 362L308 222V385H240Z" fill="url(#brass)"/>
  <!-- N right stem -->
  <path d="M415 122H470V243L415 267Z" fill="url(#brass)"/>
  <!-- detached lower piece of the N stem -->
  <path d="M470 303V386H409Z" fill="url(#brass)"/>
</svg>
